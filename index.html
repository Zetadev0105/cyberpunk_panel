<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCB's Panel V0.3</title>
    <!-- Nuevas líneas para PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <meta name="theme-color" content="#08080D">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/views.css">
    <link rel="stylesheet" href="css/fonts.css">
</head>
<body>

  <div id="app">
    <aside id="sidebar">
      <div class="brand">PCB's Panel</div>
      <nav id="nav">
        <a data-view="calendar">Calendario</a>
        <a data-view="workout">Entrenamiento</a>
        <a data-view="habits">Hábitos</a>
        <a data-view="today">Hoy</a>
        <a data-view="panel">Panel Principal</a>
        <a data-view="projects">Proyectos</a>
        <a data-view="plans">Planes de Estudio</a>
        <a data-view="performance">Rendimiento Escolar</a> 
        <a data-view="pomodoro">Pomodoro</a>
        <a data-view="timeusage">Uso del tiempo</a>
        <a data-view="tasks">Tareas</a>
        <a data-view="notes">Notas</a>
        <a data-view="tags">Etiquetas</a>
        <a data-view="inbox">Inbox</a>
        <a data-view="settings">Ajustes</a>
      </nav>
    </aside>

    <main id="main">
          <div id="main-header">
            <input type="search" id="search-main" placeholder="Buscar tareas, notas, etiquetas...">
            <button onclick="newTask(currentProjectContext())">+ Tarea</button>
            <button onclick="newNote(currentProjectContext())">+ Nota</button>
            <!-- Contenedor nuevo para botones contextuales -->
          <div id="header-view-actions" style="display:flex; gap:0.5rem;"></div>
    </div>
      <div id="main-content"></div>
    </main>
  </div>

  <div id="modal" class="hidden"></div>

  <script src="js/app.js"></script>
</body>
</html>
